<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="bolt" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#F5D5C3"/>
      <stop offset="50%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark rounded square -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bg)" stroke="#292524" stroke-width="0.75"/>
  <!-- Thunder bolt with rose gold gradient + glow -->
  <path d="M27.5 5L13 25.5H22.5L18 43L35 21H25.5L27.5 5Z" fill="url(#bolt)" filter="url(#glow)"/>
</svg>
